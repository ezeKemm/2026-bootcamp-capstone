spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"

  application:
    name: crm

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: com.northstar.crm.platform.messaging.CustomerInteractionRecordedV1
        spring.json.use.type.headers: false
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        # Fail fast on a down broker
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        max.block.ms: 3000

crm:
  messaging:
    consumer-group: ${KAFKA_CONSUMER_GROUP:crm-interaction-observer}
    retry-interval-ms: 1000
    interactions-topic: crm.customer.interactions.v1
    dead-letter-topic: crm.customer.interactions.v1.dlt
    partitions: 1
    replicas: 1

  jwt:
    secret: ${JWT_SECRET}
    ttl: 1h

  security:
    agent-password: ${CRM_AGENT_PASSWORD:agent1}   # lab-only demo users
    admin-password: ${CRM_ADMIN_PASSWORD:admin1}

  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# Spring Boot Actuator. Only health and metrics are exposed; never expose env, beans or configprops.
# /actuator/metrics/** is ADMIN only (SecurityConfig): it shows request traffic and error rates.
# /actuator/health/** is public (SecurityConfig) for deploy probes and smoke tests, so it shows no details.
# Readiness includes the database: not ready if PostgreSQL is unreachable. Kafka is deliberately NOT
# in readiness, so a broker outage does not take the API out of rotation. Liveness is unaffected by both.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never      # public endpoint: status only
      probes:
        enabled: true          # /actuator/health/liveness and /actuator/health/readiness
      group:
        readiness:
          include: readinessState,db
  metrics:
    distribution:
      # p50/p95 response time per endpoint (NFR-6), published as http.server.requests.percentile.
      # The uri tag is the URL template (/api/v1/customers/{customerId}), so there is one series per endpoint.
      percentiles:
        "[http.server.requests]": 0.5, 0.95
