spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"

  application:
    name: crm

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true

crm:
  messaging:
    interactions-topic: crm.customer.interactions.v1
    dead-letter-topic: crm.customer.interactions.v1.dlt
    partitions: 1
    replicas: 1