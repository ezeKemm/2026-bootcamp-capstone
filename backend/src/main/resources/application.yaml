spring:
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  application:
    name: crm

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
crm:
  jwt:
    secret: ${JWT_SECRET}
    ttl: 1h
  security:
    agent-password: ${CRM_AGENT_PASSWORD:agent1}   # lab-only demo users (Lab 28)
    admin-password: ${CRM_ADMIN_PASSWORD:admin1}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}