openapi: 3.1.0
info:
  title: Northstar CRM API
  version: 0.1.0
  summary: Endpoints to list, activate, and record interactions with customers.
  description: |
    Contract between the Angular frontend and the Spring Boot backend, kept in step with the
    controllers and `SecurityConfig`. Operational endpoints (`/actuator/health/**`, and the
    ADMIN-only `/actuator/metrics/**`) are not described here.

    Roles: AGENT and ADMIN. Guests have no token.
      - Guest: only `POST /api/v1/auth/login` and `GET /api/v1/public/customers`.
      - AGENT and ADMIN: read customers, activate a PROSPECT, record an interaction (ACTIVE customers only).
      - AGENT: lists only the interactions they recorded (`actor` is the token's username).
      - ADMIN: lists every interaction for a customer.
      - Nobody can delete or edit an interaction; the API has no such endpoint.
    The backend enforces these rules; the frontend only hides options.
servers:
  - url: http://localhost:8080
    description: Local backend
  - url: /
    description: Same origin behind the k3s Ingress
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Customers
  - name: Interactions
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Sign in and get a bearer token
      description: |
        Public endpoint (no token needed). A wrong password and an unknown user get the
        same 401, so callers cannot tell which one was wrong.
      security: [] # No token required
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              agent:
                value:
                  username: agent1
                  password: agent1
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                token:
                  value:
                    accessToken: '<redacted>'
                    tokenType: Bearer
                    username: agent1
                    role: AGENT
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Wrong username or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Invalid username or password
                status: 401
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/public/customers:
    get:
      tags: [Customers]
      operationId: publicBrowseCustomers
      summary: List customer summaries for public browsing
      description: |
        Public endpoint available without authentication.
        Returns only a customer's name and status, and supports pagination and filtering.
      security: []
      parameters:
        - name: page
          in: query
          required: false
          description: 0-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of records to return per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: Filter the list by customer status.
          schema:
            $ref: '#/components/schemas/CustomerStatus'
      responses:
        '200':
          description: Public customer list returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicCustomerPage'
              example:
                items:
                  - fullName: Amina Khan
                    status: ACTIVE
                  - fullName: Ravi Singh
                    status: PROSPECT
                page: 0
                size: 2
                totalItems: 42
                totalPages: 21
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/customers:
    get:
      tags: [ Customers ]
      operationId: browseCustomers
      summary: List customers for signed-in users
      description: |
        Roles: AGENT and ADMIN. Unlike the public list, each item includes the
        customer's id and email, so the frontend can link to /customers/{customerId}.
        Supports pagination and filtering by status.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: page
          in: query
          required: false
          description: 0-based page index.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Number of records to return per page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          description: Filter the list by customer status.
          schema:
            $ref: '#/components/schemas/CustomerStatus'
      responses:
        '200':
          description: Customer list returned successfully.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
              example:
                items:
                  - customerId: 5d1c2e0c-3a0d-4b1e-9f9d-8a7d9f4a1c11
                    fullName: Amina Khan
                    email: amina.khan@example.com
                    status: ACTIVE
                  - customerId: 7d3b8c73-99f7-4d06-8ce5-f8d8668ed2a1
                    fullName: Ravi Singh
                    email: ravi.singh@example.com
                    status: PROSPECT
                page: 0
                size: 20
                totalItems: 2
                totalPages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [Customers]
      operationId: getCustomer
      summary: Get one customer's profile
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Customer found.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                active:
                  value:
                    customerId: 5d1c2e0c-3a0d-4b1e-9f9d-8a7d9f4a1c11
                    fullName: Amina Khan
                    email: amina.khan@example.com
                    status: ACTIVE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/customers/{customerId}/activate:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CorrelationId'
    post:
      tags: [Customers]
      operationId: activateCustomer
      summary: Activate a customer (PROSPECT -> ACTIVE)
      description: |
        No request body. Maps to `Customer.activate()` in the UML.
        Roles: AGENT and ADMIN.
        A customer who is not a PROSPECT (e.g. already ACTIVE) cannot be activated: 422.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Customer is now ACTIVE. Returns the updated customer.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              examples:
                activated:
                  value:
                    customerId: 7d3b8c73-99f7-4d06-8ce5-f8d8668ed2a1
                    fullName: Ravi Singh
                    email: ravi.singh@example.com
                    status: ACTIVE
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '422':
          description: Customer is not a PROSPECT (e.g. already ACTIVE).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                title: Business rule violated
                status: 422
                detail: Only prospects can be activated.
                correlationId: lab-request-001
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/customers/{customerId}/interactions:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/CorrelationId'
    get:
      tags: [Interactions]
      operationId: listInteractions
      summary: List a customer's interactions (timeline), newest first
      description: |
        Results depend on the caller's role (enforced by the backend):
          - AGENT: only interactions where `actor` is the caller ("see only my own write attribution").
          - ADMIN: every interaction for the customer ("read every customer's timeline").
        Guests (no token) get 401 ("must not read a customer's timeline").
        Empty list if the customer exists but has no visible interactions.
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '200':
          description: Interactions visible to the caller, newest first.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Interaction'
              examples:
                agentView:
                  summary: What agent1 sees
                  value:
                    - interactionId: 6f1c2b7e-8d3a-4c51-9b2e-0a7d4e9f1c23
                      customerId: 5d1c2e0c-3a0d-4b1e-9f9d-8a7d9f4a1c11
                      channel: EMAIL
                      summary: Sent welcome pack.
                      actor: agent1
                      occurredAt: '2026-10-01T14:00:00Z'
                      correlationId: lab-request-001
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags: [Interactions]
      operationId: recordInteraction
      summary: Record an interaction with a customer (CAP-12)
      description: |
        `occurredAt` and `interactionId` are set by the server.
        `actor` is the authenticated user's username (the token's `sub`).
        `correlationId` is the request's `X-Correlation-Id` (a new UUID if none or an invalid one was sent).
        Roles: AGENT and ADMIN. The customer must be ACTIVE, otherwise 422 and nothing is saved.
        After the database commit the server publishes a `CustomerInteractionRecordedV1` event to Kafka.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewInteraction'
            examples:
              phoneCall:
                value:
                  channel: PHONE
                  summary: Called about renewal.
      responses:
        '201':
          description: Interaction recorded.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Interaction'
              examples:
                recorded:
                  value:
                    interactionId: 6f1c2b7e-8d3a-4c51-9b2e-0a7d4e9f1c23
                    customerId: 5d1c2e0c-3a0d-4b1e-9f9d-8a7d9f4a1c11
                    channel: PHONE
                    summary: Called about renewal.
                    actor: agent1
                    occurredAt: '2026-10-07T14:30:00Z'
                    correlationId: lab-request-001
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/CustomerNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        Access token from `POST /api/v1/auth/login`, sent as `Authorization: Bearer <token>`.
        Token carries the user's role (AGENT or ADMIN). Missing/invalid token = 401; wrong role = 403.

  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      description: Unique customer UUID.
      schema:
        $ref: '#/components/schemas/Uuid'
      examples:
        fixture:
          value: 5d1c2e0c-3a0d-4b1e-9f9d-8a7d9f4a1c11
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Traces one request across frontend, backend, logs and the Kafka event.
        The frontend interceptor always sends it. Accepted if it matches `[A-Za-z0-9._-]{1,60}`;
        otherwise the server generates a UUID. The value used is returned in the `X-Correlation-Id`
        response header and in the `correlationId` of Problem Details produced by the API.
      schema:
        type: string
        pattern: '^[A-Za-z0-9._-]{1,60}$'
      example: lab-request-001

  headers:
    CorrelationId:
      description: "Header: `X-Correlation-Id`."
      schema:
        type: string

  schemas:
    Uuid:
      type: string
      format: uuid
      description: Universally unique identifier.
      example: 5d1c2e0c-3a0d-4b1e-9f9d-8a7d9f4a1c11

    LoginRequest:
      type: object
      required: [username, password]
      additionalProperties: false
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password

    LoginResponse:
      type: object
      required: [accessToken, tokenType, username, role]
      properties:
        accessToken:
          type: string
          description: Never log or commit this value.
        tokenType:
          type: string
          enum: [Bearer]
        username:
          type: string
          description: Signed-in user (also the token's `sub` and the `actor` on interactions).
        role:
          type: string
          enum: [AGENT, ADMIN]

    PublicCustomer:
      type: object
      required: [fullName, status]
      properties:
        fullName:
          type: string
          description: Customer display name.
        status:
          $ref: '#/components/schemas/CustomerStatus'

    PublicCustomerPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicCustomer'
        page:
          type: integer
          description: 0-based page index.
        size:
          type: integer
          description: Page size used for the request.
        totalItems:
          type: integer
          description: Total matching records across all pages.
        totalPages:
          type: integer
          description: Total number of pages for the query.

    CustomerPage:
      type: object
      required: [items, page, size, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        page:
          type: integer
          description: 0-based page index.
        size:
          type: integer
          description: Page size used for the request.
        totalItems:
          type: integer
          description: Total matching records across all pages.
        totalPages:
          type: integer
          description: Total number of pages for the query.

    CustomerStatus:
      type: string
      enum: [ACTIVE, PROSPECT]

    Customer:
      type: object
      required: [customerId, fullName, email, status]
      properties:
        customerId:
          $ref: '#/components/schemas/Uuid'
        fullName:
          type: string
        email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/CustomerStatus'

    InteractionChannel:
      type: string
      description: Matches the backend `InteractionChannel` enum.
      enum: [PHONE, EMAIL, CHAT, BRANCH]

    NewInteraction:
      type: object
      required: [channel, summary]
      additionalProperties: false
      properties:
        channel:
          $ref: '#/components/schemas/InteractionChannel'
        summary:
          type: string
          minLength: 1
          maxLength: 500
          description: Free text; must not be blank.

    Interaction:
      type: object
      required: [interactionId, customerId, channel, summary, actor, occurredAt, correlationId]
      properties:
        interactionId:
          type: string
          format: uuid
        customerId:
          $ref: '#/components/schemas/Uuid'
        channel:
          $ref: '#/components/schemas/InteractionChannel'
        summary:
          type: string
        actor:
          type: string
          description: Username of who recorded it (from the authenticated user's token).
        occurredAt:
          type: string
          format: date-time
          description: Set by the server.
        correlationId:
          type: string

    ProblemDetails:
      type: object
      description: RFC 9457 Problem Details, returned as `application/problem+json`.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
        errors:
          type: array
          description: Per-field validation errors so the form can show them next to the right input.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

  responses:
    BadRequest:
      description: |
        Request is malformed or fails validation: a blank summary, a missing or unknown channel,
        a customerId that is not a UUID, or an out-of-range `page` or `size`.
        Body-validation failures list each bad field in `errors`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Validation failed
            status: 400
            detail: One or more fields are invalid.
            correlationId: lab-request-001
            errors:
              - field: summary
                message: summary is required
    Unauthorized:
      description: Missing, invalid or expired bearer token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Authentication required
            status: 401
    Forbidden:
      description: Authenticated, but the token's role is not allowed to do this.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: You do not have permission to do that
            status: 403
    CustomerNotFound:
      description: No customer with that ID.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Customer not found
            status: 404
            detail: No customer with id 8a9c7d2e-0f22-41c7-b1ef-6d1f3ac4d2ce.
            correlationId: lab-request-001
    UnprocessableEntity:
      description: |
        Well-formed but breaks a business rule, e.g. recording an interaction
        for a customer who is not ACTIVE, or activating one who is not a PROSPECT.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Business rule violated
            status: 422
            detail: Only active customers can interact with bank staff.
            correlationId: lab-request-001
    InternalServerError:
      description: |
        Unexpected server error. Details are logged, never returned; quote the correlation ID when reporting it.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          example:
            title: Unexpected error
            status: 500
            detail: Something went wrong. Quote the correlation ID if you report this.
            correlationId: lab-request-001