# Local compose only. Serves the Angular build and proxies /api to the backend container,
# so the browser sees one origin.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; re-resolves "backend" if the container restarts with a new IP.
    resolver 127.0.0.11 valid=10s;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;   # Angular routes fall back to index.html
    }
}
