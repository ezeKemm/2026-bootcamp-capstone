<!-- Page heading and count of customers matching the current filter. -->
<section class="page">
  <div class="title-row">
    <div class="title">
      <h1>Customers</h1>
      <p class="count">{{ countLabel() }}</p>
    </div>
<!-- Status filter button and its option menu. -->
    <div class="filter">
      <button
        type="button"
        class="filter-btn"
        aria-haspopup="true"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        {{ filterLabel() }}
      </button>
      @if (menuOpen()) {
        <div class="menu" role="group" aria-label="Filter by status">
          @for (option of filterOptions; track option) {
            <button
              type="button"
              class="menu-item"
              [class.chosen]="filter() === option"
              [attr.aria-pressed]="filter() === option"
              (click)="chooseFilter(option)"
            >
              {{ option }}
            </button>
          }
        </div>
      }
    </div>
  </div>
<!-- Customer table; @empty displays a message when no rows match. -->
  <table class="customers">
    <thead>
      <tr>
        <th scope="col" >Name</th>
        <th scope="col" class="status-col">Status</th>
      </tr>
    </thead>
    <tbody>
      @for (customer of visibleCustomers(); track customer.name) {
        <tr [class.selected]="selectedName() === customer.name">
          <td>
            <button type="button" class="name-btn" (click)="select(customer.customerId)">
              {{ customer.name }}
            </button>
          </td>
          <td class="status-col">
            <span
              class="badge"
              [class.badge-active]="customer.status === 'Active'"
              [class.badge-prospect]="customer.status === 'Prospect'"
            >
              {{ customer.status }}
            </span>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="2" class="empty">No customers with this status.</td>
        </tr>
      }
    </tbody>
  </table>

  <p class="hint">Select a customer to open their profile.</p>
</section>
