<section class="login" aria-labelledby="login-heading">
  <h2 id="login-heading">Sign in</h2>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (error(); as message) {
    <p role="alert" class="error-banner">{{ message }}</p>
    }

    <div class="field">
      <label for="username">Username</label>
      <input
        data-testid="login-username-input"
        id="username"
        type="text"
        formControlName="username"
        autocomplete="username"
        [attr.aria-invalid]="showError('username')"
        [attr.aria-describedby]="showError('username') ? 'username-error' : null"
      />
      @if (showError('username')) {
      <p id="username-error" class="error">Enter your username.</p>
      }
    </div>

    <div class="field">
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="showError('password')"
        [attr.aria-describedby]="showError('password') ? 'password-error' : null"
      />
      @if (showError('password')) {
      <p id="password-error" class="error">Enter your password.</p>
      }
    </div>

    <button type="submit">Sign in</button>
  </form>

  <p class="hint">
    Demo accounts: <code>agent1</code> / <code>agent1</code> · <code>admin1</code> / <code>admin1</code>
  </p>
</section>
