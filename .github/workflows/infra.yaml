# Checks the Terraform for the k3s instances: format and validity only. No AWS credentials are used or needed here;
# plan and apply run from a team member's machine (infra/README.md). Every action is pinned to a full commit SHA.
name: Infra

on:
  pull_request:
    paths: ["infra/**", ".github/workflows/infra.yaml"]
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra.yaml"]

permissions:
  contents: read

jobs:
  terraform:
    name: terraform validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.13"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
