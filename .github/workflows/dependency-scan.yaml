name: 'Dependency'

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  backend-dependency-scan:
    if: ${{ vars.RUN_DEP_SCAN == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "backend/pom.xml"
      - name: Maven Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash ./mvnw -B -ntp -Psecurity-scan -DskipTests -DnvdApiKey="$NVD_API_KEY" dependency-check:check
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-scan-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn