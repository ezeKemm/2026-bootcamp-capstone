name: 'Dependency'

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  backend-dependency-scan:
    if: ${{ vars.RUN_DEP_SCAN == 'true' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: "backend/pom.xml"
      - name: Maven Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: bash ./mvnw -B -ntp -Psecurity-scan -DskipTests -DnvdApiKey="$NVD_API_KEY" dependency-check:check
      - name: Upload scan report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-scan-report
          path: backend/target/dependency-check-report.*
          if-no-files-found: warn