# Weekly update pull requests
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: maven
    directory: "/backend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(backend)"
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(frontend)"
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*"]
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(backend)"
  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(frontend)"