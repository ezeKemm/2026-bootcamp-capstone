# The Spring Boot API. The image name below is a placeholder: CD replaces it with ghcr.io/<owner>/northstar-crm-backend@sha256:<digest>
# (kustomize images, see scripts/cd/deploy.sh). The Deployment is the unit CD rolls forward and back.
# One replica: the outbox relay polls the database every second and has not been checked for two pods polling at once.
apiVersion: v1
kind: Service
metadata:
  name: crm-api
  labels:
    app.kubernetes.io/name: crm-api
    app.kubernetes.io/part-of: northstar-crm
    crm.northstar/tier: app
spec:
  selector:
    app.kubernetes.io/name: crm-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crm-api
  labels:
    app.kubernetes.io/name: crm-api
    app.kubernetes.io/part-of: northstar-crm
    crm.northstar/tier: app
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: crm-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crm-api
        app.kubernetes.io/part-of: northstar-crm
        crm.northstar/tier: app
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ghcr-pull # created by CD only when the environment has GHCR_PULL_USER and GHCR_PULL_TOKEN; harmless for public images
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crm-api
          image: northstar-crm-backend:placeholder-set-by-cd
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: {name: crm-config}
            - configMapRef: {name: crm-env}
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef: {name: crm-secrets, key: DB_USERNAME}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: crm-secrets, key: DB_PASSWORD}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: {name: crm-secrets, key: JWT_SECRET}
            - name: CRM_AGENT_PASSWORD
              valueFrom:
                secretKeyRef: {name: crm-secrets, key: CRM_AGENT_PASSWORD}
            - name: CRM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: crm-secrets, key: CRM_ADMIN_PASSWORD}
            # Leaves room under the 1 GiB limit for metaspace, threads and buffers (the image default is 75%).
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"
          startupProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
            failureThreshold: 36 # up to 3 minutes: Flyway migrations, Kafka admin, JPA
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
