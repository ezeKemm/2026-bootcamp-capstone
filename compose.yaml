# Local dependencies: PostgreSQL and a single-node Kafka.
services:
  postgres:
    image: postgres:latest
    container_name: crm-postgres
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - crm-pgdata:/var/lib/postgresql  # PostgreSQL 18+ (old volumes will fail container)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  kafka:
    image: apache/kafka:latest
    container_name: crm-kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: PLAINTEXT for host/IDE, INTERNAL for container
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
  backend:
    profiles: ["full"]
    build:
      context: ./backend
    container_name: crm-backend
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # env_file would also pass the localhost DB_URL from .env.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      JWT_SECRET: ${JWT_SECRET:?copy .env.example to .env}
      CORS_ALLOWED_ORIGIN: http://localhost:${WEB_PORT:-4200}
    ports: ["8080:8080"]            # optional: direct access for curl or API tools
    healthcheck:
      # -f makes curl fail on a non-2xx response (a not-ready 503 counts as unhealthy). curl ships in eclipse-temurin:21-jre.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  frontend:
    profiles: ["full"]
    build:
      context: ./frontend
    container_name: crm-frontend
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Local-only nginx config with the /api proxy; the image's own nginx.conf stays as deployed.
      - ./docker/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${WEB_PORT:-4200}:8080"]
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  crm-pgdata: